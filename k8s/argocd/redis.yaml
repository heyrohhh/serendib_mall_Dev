apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serendibmall-redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: "*"
    helm:
      values: |
        image:
          registry: registry-1.docker.io
          repository: bitnami/redis
          tag: latest
        architecture: standalone
        auth:
          enabled: false
        master:
          persistence:
            size: 1Gi
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
  destination:
    server: https://kubernetes.default.svc
    namespace: serendibmall
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
