apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serendibmall-keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: "24.7.4"
    helm:
      values: |
        production: false
        auth:
          adminUser: admin
          adminPassword: admin
        httpRelativePath: /
        postgresql:
          enabled: false
        externalDatabase:
          host: serendibmall-postgresql
          port: 5432
          user: postgres
          password: postgres
          database: postgres
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 384Mi
            cpu: 300m
        extraEnvVars:
          - name: KC_FEATURES
            value: "preview"
          - name: JAVA_OPTS_APPEND
            value: "-Xms128m -Xmx256m"
        keycloakConfigCli:
          enabled: true
          configuration:
            serendibmall-realm.json: |
              {
                "realm": "serendibmall",
                "enabled": true,
                "sslRequired": "none",
                "registrationAllowed": true,
                "registrationEmailAsUsername": false,
                "loginWithEmailAllowed": true,
                "duplicateEmailsAllowed": false,
                "resetPasswordAllowed": true,
                "editUsernameAllowed": false,
                "bruteForceProtected": true,
                "roles": {
                  "realm": [
                    { "name": "user", "description": "Regular customer", "composite": false },
                    { "name": "admin", "description": "Store administrator", "composite": false }
                  ]
                },
                "defaultRoles": ["user"],
                "clients": [
                  {
                    "clientId": "serendibmall-frontend",
                    "name": "SerendibMall Frontend",
                    "enabled": true,
                    "publicClient": true,
                    "directAccessGrantsEnabled": true,
                    "standardFlowEnabled": true,
                    "implicitFlowEnabled": false,
                    "redirectUris": ["http://localhost:3000/*", "http://localhost:5173/*", "http://serendibmall.local/*"],
                    "webOrigins": ["http://localhost:3000", "http://localhost:5173", "http://serendibmall.local"],
                    "protocol": "openid-connect",
                    "attributes": {
                      "pkce.code.challenge.method": "S256",
                      "post.logout.redirect.uris": "http://localhost:3000/*##http://localhost:5173/*##http://serendibmall.local/*"
                    }
                  }
                ],
                "users": [
                  {
                    "username": "admin",
                    "email": "admin@serendibmall.com",
                    "firstName": "Store",
                    "lastName": "Admin",
                    "enabled": true,
                    "emailVerified": true,
                    "credentials": [{ "type": "password", "value": "admin123", "temporary": false }],
                    "realmRoles": ["user", "admin"]
                  },
                  {
                    "username": "customer",
                    "email": "customer@serendibmall.com",
                    "firstName": "Test",
                    "lastName": "Customer",
                    "enabled": true,
                    "emailVerified": true,
                    "credentials": [{ "type": "password", "value": "customer123", "temporary": false }],
                    "realmRoles": ["user"]
                  }
                ]
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: serendibmall
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
