apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serendibmall-redpanda
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.redpanda.com
    chart: redpanda
    targetRevision: "25.*"
    helm:
      values: |
        statefulset:
          replicas: 1
        resources:
          cpu:
            cores: 1
          memory:
            container:
              max: 2Gi
        storage:
          persistentVolume:
            size: 2Gi
        tls:
          enabled: false
        auth:
          sasl:
            enabled: false
        listeners:
          kafka:
            port: 9093
          admin:
            port: 9644
          schemaRegistry:
            enabled: false
        console:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: serendibmall
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
