apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: serendibmall

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=serendibmall"

configMapGenerator:
  - name: common-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev

images:
  - name: ghcr.io/malisha4065/serendibmall/serendibmall-bff
    newTag: main
  - name: ghcr.io/malisha4065/serendibmall/serendibmall-frontend
    newTag: main
  - name: ghcr.io/malisha4065/serendibmall/product-command-service
    newTag: main
  - name: ghcr.io/malisha4065/serendibmall/product-query-service
    newTag: main
  - name: ghcr.io/malisha4065/serendibmall/inventory-service
    newTag: main
  - name: ghcr.io/malisha4065/serendibmall/order-service
    newTag: main
  - name: ghcr.io/malisha4065/serendibmall/payment-service
    newTag: main
