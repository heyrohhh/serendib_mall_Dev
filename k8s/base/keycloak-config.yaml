apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: serendibmall
data:
  docker-entrypoint.sh: |
    #!/bin/bash
    # Substitute environment variables into the realm template
    # then start Keycloak with the resolved config
    
    TEMPLATE="/opt/keycloak/data/import-template/serendibmall-realm.json"
    OUTPUT="/opt/keycloak/data/import/serendibmall-realm.json"
    
    mkdir -p /opt/keycloak/data/import
    
    # Replace ${VAR} placeholders with actual env var values
    sed \
      -e "s|\${GOOGLE_CLIENT_ID}|${GOOGLE_CLIENT_ID:-not-configured}|g" \
      -e "s|\${GOOGLE_CLIENT_SECRET}|${GOOGLE_CLIENT_SECRET:-not-configured}|g" \
      "$TEMPLATE" > "$OUTPUT"
    
    echo "Realm config prepared with Google OAuth credentials"
    
    # Start Keycloak with all original arguments
    exec /opt/keycloak/bin/kc.sh "$@"

  serendibmall-realm.json: |
    {
        "realm": "serendibmall",
        "enabled": true,
        "sslRequired": "none",
        "registrationAllowed": true,
        "registrationEmailAsUsername": false,
        "loginWithEmailAllowed": true,
        "duplicateEmailsAllowed": false,
        "resetPasswordAllowed": true,
        "editUsernameAllowed": false,
        "bruteForceProtected": true,
        "roles": {
            "realm": [
                {
                    "name": "user",
                    "description": "Regular customer",
                    "composite": false
                },
                {
                    "name": "admin",
                    "description": "Store administrator",
                    "composite": false
                }
            ]
        },
        "defaultRoles": [
            "user"
        ],
        "clients": [
            {
                "clientId": "serendibmall-frontend",
                "name": "SerendibMall Frontend",
                "enabled": true,
                "publicClient": true,
                "directAccessGrantsEnabled": true,
                "standardFlowEnabled": true,
                "implicitFlowEnabled": false,
                "redirectUris": [
                    "http://localhost:3000/*",
                    "http://localhost:5173/*"
                ],
                "webOrigins": [
                    "http://localhost:3000",
                    "http://localhost:5173"
                ],
                "protocol": "openid-connect",
                "attributes": {
                    "pkce.code.challenge.method": "S256",
                    "post.logout.redirect.uris": "http://localhost:3000/*##http://localhost:5173/*"
                }
            }
        ],
        "users": [
            {
                "username": "admin",
                "email": "admin@serendibmall.com",
                "firstName": "Store",
                "lastName": "Admin",
                "enabled": true,
                "emailVerified": true,
                "credentials": [
                    {
                        "type": "password",
                        "value": "admin123",
                        "temporary": false
                    }
                ],
                "realmRoles": [
                    "user",
                    "admin"
                ]
            },
            {
                "username": "customer",
                "email": "customer@serendibmall.com",
                "firstName": "Test",
                "lastName": "Customer",
                "enabled": true,
                "emailVerified": true,
                "credentials": [
                    {
                        "type": "password",
                        "value": "customer123",
                        "temporary": false
                    }
                ],
                "realmRoles": [
                    "user"
                ]
            }
        ],
        "identityProviders": [
            {
                "alias": "google",
                "providerId": "google",
                "enabled": true,
                "trustEmail": true,
                "firstBrokerLoginFlowAlias": "first broker login",
                "config": {
                    "clientId": "${GOOGLE_CLIENT_ID}",
                    "clientSecret": "${GOOGLE_CLIENT_SECRET}",
                    "defaultScope": "openid email profile",
                    "syncMode": "IMPORT"
                }
            }
        ]
    }
