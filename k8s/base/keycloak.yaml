apiVersion: apps/v1
kind: Deployment
metadata:
  name: serendibmall-keycloak
  namespace: serendibmall
  labels:
    app: serendibmall-keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serendibmall-keycloak
  template:
    metadata:
      labels:
        app: serendibmall-keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2
          command:
            - /opt/keycloak/custom-entrypoint.sh
            - start-dev
            - --import-realm
            - --health-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "admin"
            - name: KC_HTTP_PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: keycloak-secrets
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: keycloak-config-vol
              mountPath: /opt/keycloak/custom-entrypoint.sh
              subPath: docker-entrypoint.sh
            - name: keycloak-config-vol
              mountPath: /opt/keycloak/data/import-template/serendibmall-realm.json
              subPath: serendibmall-realm.json
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 20
      volumes:
        - name: keycloak-config-vol
          configMap:
            name: keycloak-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: serendibmall-keycloak
  namespace: serendibmall
spec:
  selector:
    app: serendibmall-keycloak
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
