# PostgreSQL StatefulSet using official image (replaces Bitnami Helm chart)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE DATABASE product_db;
    CREATE DATABASE inventory_db;
    CREATE DATABASE order_db;

    \c order_db;
    CREATE TABLE IF NOT EXISTS orders (id VARCHAR(255) PRIMARY KEY, product_id VARCHAR(255), user_id VARCHAR(255), quantity INT, status VARCHAR(50), created_at TIMESTAMP);
    CREATE TABLE IF NOT EXISTS order_outbox (id VARCHAR(255) PRIMARY KEY, aggregate_type VARCHAR(255) NOT NULL, aggregate_id VARCHAR(255) NOT NULL, event_type VARCHAR(255) NOT NULL, payload TEXT NOT NULL, created_at TIMESTAMP NOT NULL DEFAULT NOW());

    \c inventory_db;
    CREATE TABLE IF NOT EXISTS inventory (id VARCHAR(255) PRIMARY KEY, product_id VARCHAR(255) UNIQUE NOT NULL, quantity INT DEFAULT 0);
    CREATE TABLE IF NOT EXISTS inventory_outbox (id VARCHAR(255) PRIMARY KEY, aggregate_type VARCHAR(255) NOT NULL, aggregate_id VARCHAR(255) NOT NULL, event_type VARCHAR(255) NOT NULL, payload TEXT NOT NULL, created_at TIMESTAMP NOT NULL DEFAULT NOW());

    CREATE DATABASE payment_db;
    \c payment_db;
    CREATE TABLE IF NOT EXISTS payments (id VARCHAR(255) PRIMARY KEY, order_id VARCHAR(255) NOT NULL, amount DECIMAL(10,2), status VARCHAR(50) NOT NULL, transaction_id VARCHAR(255), created_at TIMESTAMP NOT NULL DEFAULT NOW());
    CREATE TABLE IF NOT EXISTS payment_outbox (id VARCHAR(255) PRIMARY KEY, aggregate_type VARCHAR(255) NOT NULL, aggregate_id VARCHAR(255) NOT NULL, event_type VARCHAR(255) NOT NULL, payload TEXT NOT NULL, created_at TIMESTAMP NOT NULL DEFAULT NOW());
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: serendibmall-postgresql
  labels:
    app: serendibmall-postgresql
spec:
  serviceName: serendibmall-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: serendibmall-postgresql
  template:
    metadata:
      labels:
        app: serendibmall-postgresql
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 300m
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: serendibmall-postgresql
spec:
  selector:
    app: serendibmall-postgresql
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
