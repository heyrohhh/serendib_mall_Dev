apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: serendibmall

resources:
  - namespace.yaml
  - secrets.yaml
  - bff.yaml
  - frontend.yaml
  - keycloak-config.yaml
  - keycloak.yaml
  - product-command.yaml
  - product-query.yaml
  - inventory.yaml
  - order.yaml
  - payment.yaml
  - ingress.yaml

configMapGenerator:
  - name: common-config
    literals:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=redpanda.serendibmall.svc.cluster.local:29092
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch.serendibmall.svc.cluster.local:9200
      - SPRING_DATA_REDIS_HOST=redis.serendibmall.svc.cluster.local
      - SPRING_DATA_REDIS_PORT=6379

secretGenerator:
  - name: keycloak-secrets
    literals:
      - GOOGLE_CLIENT_ID=placeholder_id
      - GOOGLE_CLIENT_SECRET=placeholder_secret

commonLabels:
  app.kubernetes.io/part-of: serendibmall
  app.kubernetes.io/managed-by: kustomize
