apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: serendibmall

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - bff.yaml
  - frontend.yaml
  - keycloak-config.yaml
  - keycloak.yaml
  - product-command.yaml
  - product-query.yaml
  - inventory.yaml
  - order.yaml
  - payment.yaml
  - ingress.yaml

secretGenerator:
  - name: keycloak-secrets
    literals:
      - GOOGLE_CLIENT_ID=placeholder_id
      - GOOGLE_CLIENT_SECRET=placeholder_secret

commonLabels:
  app.kubernetes.io/part-of: serendibmall
  app.kubernetes.io/managed-by: kustomize
