apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: serendibmall

resources:
  - namespace.yaml
  - secrets.yaml
  - bff.yaml
  - frontend.yaml
  - product-command.yaml
  - product-query.yaml
  - inventory.yaml
  - order.yaml
  - payment.yaml
  - ingress.yaml

configMapGenerator:
  - name: common-config
    literals:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=serendibmall-redpanda:9093
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch-master:9200
      - SPRING_DATA_REDIS_HOST=serendibmall-redis-master
      - SPRING_DATA_REDIS_PORT=6379

commonLabels:
  app.kubernetes.io/part-of: serendibmall
  app.kubernetes.io/managed-by: kustomize

