apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: serendibmall

resources:
  - namespace.yaml
  - secrets.yaml
  - postgres.yaml
  - redis.yaml
  - keycloak.yaml
  - bff.yaml
  - frontend.yaml
  - debezium.yaml
  - zipkin.yaml
  - product-command.yaml
  - product-query.yaml
  - inventory.yaml
  - order.yaml
  - payment.yaml
  - ingress.yaml

configMapGenerator:
  - name: common-config
    literals:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=serendibmall-redpanda:9093
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch-master:9200
      - SPRING_DATA_REDIS_HOST=serendibmall-redis-master
      - SPRING_DATA_REDIS_PORT=6379
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://serendibmall-keycloak:80/realms/serendibmall/protocol/openid-connect/certs
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m

commonLabels:
  app.kubernetes.io/part-of: serendibmall
  app.kubernetes.io/managed-by: kustomize


