apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serendibmall-ingress
  namespace: serendibmall
spec:
  ingressClassName: traefik
  rules:
    - host: serendibmall.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serendibmall-frontend
                port:
                  number: 80
    - host: auth.serendibmall.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serendibmall-keycloak
                port:
                  number: 8080
    - host: api.serendibmall.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serendibmall-bff
                port:
                  number: 80
