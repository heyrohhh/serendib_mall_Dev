# Redis Deployment using official image (replaces Bitnami Helm chart)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serendibmall-redis-master
  labels:
    app: serendibmall-redis-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serendibmall-redis-master
  template:
    metadata:
      labels:
        app: serendibmall-redis-master
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 150m
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: serendibmall-redis-master
spec:
  selector:
    app: serendibmall-redis-master
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
